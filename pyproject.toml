[project]
name = "s16-networkx-agent"
version = "0.1.0"
description = "NetworkX-First Agent Architecture with Multi-Agent System"
readme = "README_S16.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.25.0",
    "mcp>=0.9.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "readability-lxml>=0.8.1",
    "trafilatura>=1.6.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pymupdf4llm>=0.0.5",
    "markitdown[docx]>=0.0.1a2",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
ui = [
    "gradio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "config", "core", "memory", "mcp_servers", "prompts", "tools", "ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
